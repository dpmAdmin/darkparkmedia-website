<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Placeholder house cutout">
  <!-- PLACEHOLDER stand-in for the isolated house cutout. Alpha everywhere
       outside the silhouette, exactly like the real PNG will be. -->
  <defs>
    <linearGradient id="mass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3640"/>
      <stop offset="1" stop-color="#1b2027"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe0ef" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8fa8bd" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- lower volume -->
  <path d="M150 300 H760 V462 H150 Z" fill="url(#mass)"/>
  <!-- cantilevered upper volume, oversailing to the left -->
  <path d="M96 186 H612 V300 H96 Z" fill="url(#mass)"/>
  <!-- roof lip -->
  <path d="M84 174 H624 V190 H84 Z" fill="#39424c"/>
  <!-- chimney / service stack -->
  <path d="M660 232 H700 V300 H660 Z" fill="url(#mass)"/>

  <!-- glazing -->
  <rect x="132" y="206" width="176" height="74" fill="url(#glass)"/>
  <rect x="330" y="206" width="252" height="74" fill="url(#glass)"/>
  <rect x="186" y="330" width="150" height="96" fill="url(#glass)"/>
  <rect x="366" y="330" width="112" height="96" fill="url(#glass)"/>
  <rect x="510" y="330" width="200" height="96" fill="url(#glass)"/>

  <!-- mullions -->
  <g stroke="#1b2027" stroke-width="5" opacity="0.55">
    <line x1="220" y1="206" x2="220" y2="280"/>
    <line x1="414" y1="206" x2="414" y2="280"/>
    <line x1="498" y1="206" x2="498" y2="280"/>
    <line x1="261" y1="330" x2="261" y2="426"/>
    <line x1="610" y1="330" x2="610" y2="426"/>
  </g>

  <!-- entry soffit -->
  <path d="M760 392 H812 V462 H760 Z" fill="#232932"/>
  <!-- deck -->
  <path d="M120 462 H830 V478 H120 Z" fill="#232932"/>
</svg>
