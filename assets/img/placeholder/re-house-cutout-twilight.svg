<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Placeholder house cutout, twilight">
  <!-- PLACEHOLDER twilight counterpart of re-house-cutout.svg. Geometry is
       byte-identical to the day version — only the palette changes — so the
       wipe reads as dusk falling rather than the house jumping. The real
       pair must hold the same discipline: locked-off camera, identical crop. -->
  <defs>
    <linearGradient id="tmass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a36"/>
      <stop offset="1" stop-color="#141922"/>
    </linearGradient>
  </defs>

  <!-- lower volume -->
  <path d="M150 300 H760 V462 H150 Z" fill="url(#tmass)"/>
  <!-- cantilevered upper volume -->
  <path d="M96 186 H612 V300 H96 Z" fill="url(#tmass)"/>
  <!-- roof lip -->
  <path d="M84 174 H624 V190 H84 Z" fill="#2b3340"/>
  <!-- service stack -->
  <path d="M660 232 H700 V300 H660 Z" fill="url(#tmass)"/>

  <!-- lit glazing -->
  <rect x="132" y="206" width="176" height="74" fill="#ffd39a" opacity="0.94"/>
  <rect x="330" y="206" width="252" height="74" fill="#ffcf92" opacity="0.9"/>
  <rect x="186" y="330" width="150" height="96" fill="#ffd7a4" opacity="0.92"/>
  <rect x="366" y="330" width="112" height="96" fill="#ffc98a" opacity="0.87"/>
  <rect x="510" y="330" width="200" height="96" fill="#ffd39a" opacity="0.92"/>

  <!-- mullions -->
  <g stroke="#141922" stroke-width="5" opacity="0.6">
    <line x1="220" y1="206" x2="220" y2="280"/>
    <line x1="414" y1="206" x2="414" y2="280"/>
    <line x1="498" y1="206" x2="498" y2="280"/>
    <line x1="261" y1="330" x2="261" y2="426"/>
    <line x1="610" y1="330" x2="610" y2="426"/>
  </g>

  <!-- entry soffit + deck -->
  <path d="M760 392 H812 V462 H760 Z" fill="#1a202a"/>
  <path d="M120 462 H830 V478 H120 Z" fill="#1a202a"/>
</svg>
